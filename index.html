/* Slate night palette, shared by the gallery and its editing surfaces. */
:root{color-scheme:dark;--ink:#e1e6ef;--muted:#a3adbf;--line:#394353;--blue:#9caeff;--surface:#2a3342}
body{background:#222a37;color:var(--ink)}
.topbar{background:#252e3c}.brandmark,.primary{background:#596ed5;color:#f0f3ff}.primary:hover{background:#697ee4}
.brand-en{color:#a9b4c7;border-color:var(--line)}.private,.crumbs,.intro,.back{color:#aab5c8}.crumbs>span:last-child{color:#e1e7f4}
.eyebrow span,.count,.sectionbar{color:#a4afc3}.sectionlabel{color:#cad3e4}
.cover,.image-grid .cover{background:#2a3444}.placeholder{background:linear-gradient(145deg,#303d52,#283342);color:#8498ba}.placeholder>span{color:#61718d}
.cover-label{background:#273344e8;color:#dae4f5;border-color:#56688180}.card-copy p{color:#adb8cc}.more{color:#b4bfd2}.more:hover{background:#3a475d}
.add-card{background:#273140;border-color:#526078}.add-card:hover{background:#2b3749;border-color:#6b7c99}.add-art strong{color:#cfdaee}.add-art>span:last-child{color:#a4b1c7}
.plus-circle{background:#303d52;border-color:#51617d;color:#adc0ff}.add-footer{border-color:#445169;color:#a7b4cb}
.empty-note,.empty-note strong{color:#a2aec3}.mini-line{background:#52617a}footer{color:#a2aec2}
dialog{background:#2a3443;color:var(--ink)}dialog::backdrop{background:#141e30a6}.icon-button{background:#39465b}.secondary{background:#303c4e;color:#dce5f4}.secondary:hover{background:#3b4960}
.upload-area{background:#253143;border-color:#586b88;color:#b6c5de}.uploading{background:#28374eea;color:#dce7f9}
label>span{color:#a9b5ca}input,textarea{background:#222d3d;color:#e3eaf5;border-color:#4c5b73}input::placeholder,textarea::placeholder{color:#9facbf}
.delete,.form-error{color:#ffa7b3}.toast{background:#3c4d68;color:#eef3ff}.lightbox{background:#242e3d}.light-close,.light-prev,.light-next{background:#44516bd9}
/* Ratios describe the image viewport, independently of captions. */
.work-grid .cover,.work-grid .add-art{aspect-ratio:832 / 1216}
.landscape-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.landscape-grid .cover,.landscape-grid .add-art{aspect-ratio:1216 / 832}
.landscape-grid .cover img{object-fit:contain}.landscape-grid .card-main:hover .cover img{transform:none}
.landscape-grid .add-art{gap:8px;padding:14px}.landscape-grid .plus-circle{height:42px;width:42px;margin-bottom:2px}
/* A masked conic highlight travels around the perimeter without covering images. */
@property --rim-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
.card,.add-card{position:relative;isolation:isolate;border-radius:13px;--border-color:#a6baff;--border-soft:#8eaaff20}
.card{padding:1px 1px 12px;align-self:start}.card-copy{padding-left:8px}.more{right:6px;bottom:36px}
.card::after,.add-card::after{content:'';position:absolute;inset:-2px;z-index:3;pointer-events:none;border-radius:inherit;padding:2px;background:conic-gradient(from var(--rim-angle),transparent 0deg,transparent 210deg,var(--border-soft) 265deg,var(--border-color) 325deg,transparent 360deg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;opacity:0;transition:opacity .2s}
.add-card{overflow:visible}.card:hover::after,.card:focus-within::after,.add-card:hover::after,.add-card:focus-visible::after{opacity:1;animation:rim-orbit 2.6s linear infinite}
@keyframes rim-orbit{to{--rim-angle:360deg}}
@media(max-width:1050px){.landscape-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.landscape-grid{grid-template-columns:1fr}.landscape-grid .add-art{gap:11px}.landscape-grid .plus-circle{height:48px;width:48px}}
@media(prefers-reduced-motion:reduce){.card::after,.add-card::after{animation:none!important;--rim-angle:45deg}}

.auth-note{font-size:14px;color:#b5c2d8;line-height:1.7;overflow-wrap:anywhere}.empty-note{position:static;margin:38px 0}

button{line-height:1.4}input,textarea{line-height:1.5}img{display:block}dialog:not([open]){display:none}

.admin-links{display:flex;align-items:center;gap:20px}.admin-links a{text-decoration:none}.admin-links a:hover{color:#dae5ff}

.editor-toolbar{max-width:1296px;margin:24px auto 0;padding:22px;background:#2c3950;border:1px solid #51627f;border-radius:12px;width:90%}.editor-toolbar b{font-size:16px}.editor-toolbar p{font-size:14px;color:#b6c5df;line-height:1.7;margin:10px 0}.editor-buttons{display:flex;gap:10px;flex-wrap:wrap}.editor-status{margin-bottom:0!important;color:#d3dfff!important}.editor-toolbar input[hidden]{display:none}
